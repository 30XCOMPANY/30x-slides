[phases.setup]
aptPkgs = ["python3-pip", "libreoffice-core", "libreoffice-impress", "libreoffice-writer", "fonts-noto-cjk", "fonts-liberation", "fonts-dejavu", "fonts-roboto", "fonts-open-sans", "fonts-lato", "fontconfig"]

[phases.install]
cmds = ["pip3 install --break-system-packages -r requirements.txt"]

[start]
cmd = "python3 -m gunicorn --bind 0.0.0.0:${PORT:-8080} --workers 2 --timeout 120 app:app"
