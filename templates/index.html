<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>30X Slides</title>
<link rel="preload" href="/static/hero-bg.mp4" as="video" type="video/mp4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'Geist Pixel';
    src: url('https://cdn.jsdelivr.net/npm/geist@1/dist/fonts/geist-pixel/GeistPixel-Square.woff2') format('woff2');
    font-weight: 400;
    font-display: swap;
  }

  :root {
    --page-bg: #fbfaf8;
    --text-strong: #17161c;
    --text-muted: #67636e;
    --text-soft: #9a95a1;
    --font-sans: 'Public Sans', ui-sans-serif, system-ui, sans-serif;
    --font-display: 'Instrument Serif', Baskerville, Georgia, serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: var(--page-bg);
    color: var(--text-strong);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  /* ---- 导航栏 ---- */
  .nav-shell {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    height: 72px;
    padding-inline: 32px;
  }
  .nav-brand {
    font-family: 'Geist Pixel', monospace;
    font-size: 16px;
    font-weight: 400;
    letter-spacing: 0.02em;
    color: rgba(255, 255, 255, 0.88);
    text-decoration: none;
  }
  .nav-brand span { opacity: 0.5; }

  /* ---- Hero 视频背景 (复刻 30X Events hero-video-shell) ---- */
  .hero-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    background:
      radial-gradient(42% 38% at 18% 18%, rgba(246, 221, 213, 0.26), transparent 72%),
      radial-gradient(36% 32% at 82% 20%, rgba(183, 198, 255, 0.2), transparent 74%),
      radial-gradient(34% 30% at 50% 78%, rgba(71, 173, 232, 0.14), transparent 76%),
      linear-gradient(180deg, #30283c 0%, #17161c 54%, #111018 100%);
  }
  .hero-video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: saturate(0.92) contrast(0.95) brightness(1.02);
    opacity: 1;
    transition: opacity 0.2s ease;
  }
  .hero-video:not(.loaded) { opacity: 0.34; }
  .hero-video.loaded { opacity: 1; }

  /* 视频上层叠加 — 复刻 hero-video-overlay 多层渐变 */
  .hero-overlay {
    position: absolute;
    inset: 0;
    z-index: 1;
    background:
      linear-gradient(180deg, rgba(23,19,33,0.45) 0%, rgba(23,19,33,0.35) 50%, rgba(23,19,33,0.5) 80%, var(--page-bg) 100%),
      radial-gradient(38% 30% at 22% 18%, rgba(246,221,213,0.12), transparent 72%),
      radial-gradient(34% 28% at 76% 18%, rgba(223,216,239,0.1), transparent 74%),
      radial-gradient(40% 32% at 50% 74%, rgba(79,196,255,0.06), transparent 78%);
  }

  /* ---- 主容器 ---- */
  .main {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px 24px;
  }

  /* ---- Hero 标题 (白字，在深色背景上) ---- */
  .hero-title {
    text-align: center;
    margin-bottom: 40px;
  }
  .hero-title h1 {
    font-family: var(--font-sans);
    font-size: 44px;
    font-weight: 700;
    letter-spacing: -0.03em;
    color: rgba(255, 255, 255, 0.9);
    margin-bottom: 12px;
    line-height: 1.05;
  }
  .hero-title .serif-accent {
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 400;
    color: rgba(255, 255, 255, 0.55);
    font-size: 40px;
    letter-spacing: -0.02em;
  }
  .hero-title p {
    font-size: 17px;
    color: rgba(255, 255, 255, 0.5);
    font-weight: 400;
    line-height: 1.5;
    letter-spacing: -0.01em;
  }

  /* ============================================================
     上传卡片 — 完全复刻 hero-filter-panel 玻璃质感
     ============================================================ */
  .upload-card {
    position: relative;
    width: 100%;
    max-width: 520px;
    border-radius: 26px;
    border: 1px solid rgba(255, 255, 255, 0.22);
    overflow: hidden;
    background:
      linear-gradient(180deg, rgba(255, 250, 245, 0.14), rgba(234, 243, 251, 0.08)),
      radial-gradient(34% 44% at 28% 36%, rgba(246, 221, 213, 0.11), transparent 74%),
      radial-gradient(36% 44% at 74% 34%, rgba(223, 216, 239, 0.1), transparent 78%);
    backdrop-filter: blur(24px) saturate(1.3);
    -webkit-backdrop-filter: blur(24px) saturate(1.3);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.18),
      0 18px 48px rgba(17, 14, 24, 0.2);
    transition: transform 0.22s, box-shadow 0.22s, border-color 0.22s;
  }
  .upload-card:hover {
    transform: translateY(-3px);
    border-color: rgba(255, 255, 255, 0.3);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.24),
      0 26px 56px rgba(17, 14, 24, 0.28);
  }

  .upload-card-body {
    padding: 44px 36px;
  }

  /* ---- Drop zone (玻璃内部) ---- */
  .drop-zone {
    border: 1.5px dashed rgba(255, 255, 255, 0.2);
    border-radius: 16px;
    padding: 48px 32px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .drop-zone:hover, .drop-zone.dragover {
    border-color: rgba(255, 255, 255, 0.4);
    background: rgba(255, 255, 255, 0.06);
  }
  .drop-zone p {
    font-size: 15px;
    color: rgba(255, 255, 255, 0.7);
    margin-bottom: 20px;
    font-weight: 500;
  }
  .drop-zone .hint {
    font-size: 12px;
    color: rgba(255, 255, 255, 0.35);
    margin-top: 16px;
  }
  input[type="file"] { display: none; }

  /* CTA 按钮 — 浅色实体按钮在深色玻璃上 */
  .btn-cta {
    display: inline-block;
    background: rgba(255, 255, 255, 0.92);
    color: var(--text-strong);
    border: none;
    padding: 12px 28px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    letter-spacing: -0.01em;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
    transition: all 0.18s;
  }
  .btn-cta:hover {
    background: #fff;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
    transform: translateY(-1px);
  }

  /* ---- Loading ---- */
  .loading {
    display: none;
    margin-top: 24px;
    color: rgba(255, 255, 255, 0.65);
    font-size: 14px;
    font-weight: 500;
    text-align: center;
  }
  .loading.show { display: block; }
  .spinner {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 2px solid rgba(255, 255, 255, 0.2);
    border-top-color: rgba(255, 255, 255, 0.8);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- Footer ---- */
  .footer {
    position: fixed;
    bottom: 24px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.25);
    font-weight: 500;
    z-index: 1;
  }
</style>
</head>
<body>

<div class="hero-bg">
  <video class="hero-video" autoplay muted loop playsinline preload="auto"
    oncanplaythrough="this.classList.add('loaded')" onplaying="this.classList.add('loaded')">
    <source src="/static/hero-bg.mp4" type="video/mp4">
  </video>
  <div class="hero-overlay"></div>
</div>

<nav class="nav-shell">
  <a href="/" class="nav-brand">30X <span>SLIDES</span></a>
</nav>

<div class="main">
  <div class="hero-title">
    <h1>Upload <span class="serif-accent">your</span> Slides</h1>
    <p>Turn any PPTX into interactive slides with a voice guide.</p>
  </div>

  <form id="form" action="/upload" method="post" enctype="multipart/form-data">
    <div class="upload-card">
      <div class="upload-card-body">
        <div class="drop-zone" id="dropZone">
          <p>Drop your .pptx here</p>
          <button type="button" class="btn-cta" onclick="document.getElementById('fileInput').click()">
            Choose File
          </button>
          <input type="file" id="fileInput" name="file" accept=".pptx">
          <div class="hint">.pptx only, up to 100 MB</div>
        </div>
        <div class="loading" id="loading">
          <span class="spinner"></span> Converting slides...
        </div>
      </div>
    </div>
  </form>
</div>

<div class="footer">30X Company</div>

<script>
const form = document.getElementById('form');
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const loading = document.getElementById('loading');

fileInput.addEventListener('change', () => {
  if (fileInput.files.length) submit();
});

dropZone.addEventListener('dragover', e => {
  e.preventDefault();
  dropZone.classList.add('dragover');
});
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  if (file && file.name.endsWith('.pptx')) {
    fileInput.files = e.dataTransfer.files;
    submit();
  }
});

function submit() {
  loading.classList.add('show');
  dropZone.style.display = 'none';
  form.submit();
}
</script>
</body>
</html>
